[project]
name = "agentos-runtime"
version = "0.1.0"
description = "AgentOS agent runtime: LangGraph ReAct agent behind a FastAPI service"
license = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "ifahad", email = "me@fahad.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "croniter>=6.2.4",
    "deepagents>=0.6.12",
    "fastapi>=0.139.2",
    "langchain>=1.3.14",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "llama-index-core>=0.14.23",
    "llama-index-vector-stores-postgres>=0.8.1",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[project.scripts]
agentos-runtime = "agentos_runtime.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
