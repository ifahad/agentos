# Default eval suite against the seeded legacy ERP + ingested vendor-policy doc.
# A case passes when the run completes, expect_substring appears
# (case-insensitively) in the final answer, and expect_tool (if set) was used.
# A case may add a judge block {criteria, threshold}: the judge model
# (AGENTOS_JUDGE_MODEL, via the gateway) grades the answer 0..1 against the
# criteria and the case additionally requires score >= threshold.
cases:
  - name: top-customer-by-order-value
    input: >-
      Which customer has the highest total order value across all their
      orders? Give the customer name.
    expect_substring: "al-faisal"
    expect_tool: query
  - name: pending-orders-count
    input: How many orders are currently in pending status? Answer with the number.
    expect_substring: "4"
  - name: procurement-sign-off
    input: >-
      According to our procurement policy, who signs off on purchase orders
      above 250000 SAR?
    expect_substring: "al-harbi"
    expect_tool: search_knowledge
  - name: arithmetic-sanity
    input: What is 6 times 7? Reply with just the number.
    expect_substring: "42"
  - name: top-customer-cited-judged
    input: >-
      Which customer generates the most revenue for us, and how do you know?
      Explain briefly and name the data you used.
    expect_substring: "al-faisal"
    expect_tool: query
    judge:
      criteria: >-
        The answer identifies Al-Faisal Trading Co. as the top customer AND
        cites the source table(s) the figure came from (e.g. the orders
        and/or customers tables of the ERP database).
      threshold: 0.7
