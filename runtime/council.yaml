# Multiverse council registry.
#
# The five frontier members below are DISABLED: their provider entries in
# deploy/providers.json carry placeholder endpoints and pricing that an operator
# must confirm first. The enabled members are local Ollama models, so a full
# five-way council runs at zero cost.
#
# A member's `model` must never use the reserved `council/` prefix.
#
# GATING CAVEAT: deepagents compiles its own graph with no interrupt_before
# pass-through, so the council cannot hold a deep member's write-class tool calls
# in-graph. Every `profile: deep` member is therefore given an explicit read-only
# `tools:` list — that IS its action surface. A test asserts this holds.
judge: ollama/qwen3.6:latest
quorum: 3
agreement_threshold: 0.6
max_cycles: 8
max_tool_steps: 12
member_timeout_s: 300

members:
  # --- frontier members: enable after confirming provider config ---
  - id: kimi
    model: moonshot/kimi-k3
    enabled: false
    profile: deep
    persona: "Prioritize inspecting schemas and citing exact tables before concluding."
    tools: [query, list_tables, describe_table, search_knowledge, run_python]
  - id: glm
    model: zhipu/glm-5.2
    enabled: false
    profile: deep
    tools: [query, list_tables, describe_table, search_knowledge, run_python]
  - id: qwen-max
    model: alibaba/qwen3.8-max
    enabled: false
    profile: deep
    tools: [query, list_tables, describe_table, search_knowledge, run_python]
  - id: deepseek
    model: deepseek/deepseek-v4-pro
    enabled: false
    profile: deep
    tools: [query, list_tables, describe_table, search_knowledge, run_python]
  - id: minimax
    model: minimax/minimax-m3
    enabled: false
    profile: deep
    tools: [query, list_tables, describe_table, search_knowledge, run_python]

  # --- local members: a real five-way council at $0 ---
  # These run the REACT profile, not deep. Empirically (scripts/smoke9.sh) the
  # local models on the deep profile exhaust the recursion limit inside
  # deepagents' own graph — its todo/filesystem/subagent middleware is deeper
  # than max_tool_steps allows — and answer nothing. On react they call tools
  # reliably and are gated in-graph by the council (no explicit tools list
  # needed). The frontier members keep deep, but they are disabled and unverified.
  - id: local-qwen36
    model: ollama/qwen3.6:latest
    enabled: true
    profile: react
  - id: local-qwen35
    model: ollama/qwen3.5:latest
    enabled: true
    profile: react
  - id: local-gemma4-31b
    model: ollama/gemma4:31b
    enabled: true
    profile: react
  - id: local-gemma4
    model: ollama/gemma4:latest
    enabled: true
    profile: react
  - id: local-gemma3
    model: ollama/gemma3:latest
    enabled: true
    profile: react
