server {
    # 8080, not 80: the server runs unprivileged and cannot bind a low port.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The page is one self-contained file — fonts are base64-inlined and there
    # are no external requests — so there is nothing content-hashed to cache
    # forever. Revalidate every load instead, or a rebuilt page never reaches a
    # browser that has already seen the old one. "no-cache" still allows a 304
    # via ETag, so the 154 KB body is only re-sent when it actually changed.
    location / {
        add_header Cache-Control "no-cache";
    }
}
