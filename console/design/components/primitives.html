<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgentOS — Primitives</title>
<style>
  :root {
    --bg: #0a0b0d; --raised: #101318; --inset: #0c0e12;
    --border: rgba(255,255,255,0.06); --border-strong: rgba(255,255,255,0.09);
    --text: #d6dae1; --text-dim: #8b929d; --text-faint: #5c636e;
    --accent: #5b8cff; --accent-dim: rgba(91,140,255,0.12);
    --green: #43b374; --amber: #d2a24a; --red: #d86060;
    --dur-fast: 120ms; --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    padding: 32px; font-size: 13px;
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 4px; }
  .sub { color: var(--text-dim); margin-bottom: 28px; }
  h2 {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--text-faint); margin: 26px 0 12px;
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--inset); border: 1px solid var(--border-strong);
    border-radius: 6px; color: var(--text); font: inherit;
    padding: 7px 14px; cursor: pointer;
    transition: border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), filter var(--dur-fast) var(--ease);
  }
  .btn:hover { border-color: var(--text-faint); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0a0b0d; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { border-color: rgba(216,96,96,0.5); color: var(--red); }
  .btn.small { padding: 4px 10px; font-size: 12.5px; }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--border-strong); color: var(--text-dim);
  }
  .badge.chat { color: var(--accent); border-color: rgba(91,140,255,0.4); }
  .badge.embeddings { color: var(--green); border-color: rgba(67,179,116,0.4); }
  .badge.flag { color: var(--amber); border-color: rgba(210,162,74,0.5); background: rgba(210,162,74,0.08); }
  .badge.block { color: var(--red); border-color: rgba(216,96,96,0.5); background: rgba(216,96,96,0.08); }

  .field { width: 280px; }
  .field span { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  .field input {
    width: 100%; background: var(--inset); border: 1px solid var(--border-strong);
    border-radius: 6px; color: var(--text); font: inherit; padding: 8px 10px;
    transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  .field input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .meter { width: 140px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .meter > div { height: 100%; background: var(--accent); width: 0; animation: fill 1.2s var(--ease) forwards; }
  .meter.hot > div { background: var(--red); }
  @keyframes fill { to { width: var(--w); } }
  @media (prefers-reduced-motion: reduce) { .meter > div { animation: none; width: var(--w); } }
</style>
</head>
<body>
  <h1>Primitives</h1>
  <p class="sub">Buttons, badges, inputs, meters — the vocabulary every page speaks.</p>

  <h2>Buttons</h2>
  <div class="row">
    <button class="btn primary">Create key</button>
    <button class="btn">Save changes</button>
    <button class="btn danger">Revoke</button>
    <button class="btn small">Small</button>
  </div>

  <h2>Badges</h2>
  <div class="row">
    <span class="badge chat">chat</span>
    <span class="badge embeddings">embeddings</span>
    <span class="badge flag">guardrail flag</span>
    <span class="badge block">guardrail block</span>
    <span class="badge">inactive</span>
  </div>

  <h2>Input — focus ring is accent-dim, not a glow</h2>
  <label class="field"><span>Key name</span><input type="text" placeholder="production-agent" autofocus></label>

  <h2>Budget meters</h2>
  <div class="row">
    <span class="meter"><div style="--w:62%"></div></span>
    <span class="meter hot"><div style="--w:91%"></div></span>
  </div>
</body>
</html>
