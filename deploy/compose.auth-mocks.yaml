# Phase 6 test doubles: a mock OIDC provider and a mock Vault, for exercising
# SSO and the vault secrets backend end-to-end without real infrastructure.
#   docker compose -f compose.yaml -f compose.auth-mocks.yaml up -d
# smoke6 sets the matching AGENTOS_OIDC_* / AGENTOS_VAULT_* env on the gateway.
services:
  mock-oidc:
    image: python:3.12-slim
    command: ["python", "/app/mock-oidc.py", "9000"]
    environment:
      AGENTOS_MOCK_OIDC_ISSUER: http://mock-oidc:9000
    volumes:
      - ./ci:/app:ro
    ports:
      - "${AGENTOS_MOCK_OIDC_PORT:-9000}:9000"

  mock-vault:
    image: python:3.12-slim
    command: ["python", "/app/mock-vault.py", "8200"]
    environment:
      AGENTOS_MOCK_VAULT_TOKEN: test-token
    volumes:
      - ./ci:/app:ro
    ports:
      - "${AGENTOS_MOCK_VAULT_PORT:-8200}:8200"
