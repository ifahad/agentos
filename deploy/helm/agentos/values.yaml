# Default values for the agentos chart.
# Service topology and env contracts mirror deploy/compose.yaml (Phase 3).

nameOverride: ""
fullnameOverride: ""

# -- Chart-managed credentials (rendered into a Secret named <fullname>-secrets).
# Override these for anything beyond a local/dev cluster.
adminKey: "admin-local-dev"
runtimeKey: "agos-local-dev-runtime"
# -- Bearer token the runtime demands on every route except GET /healthz and
# /operators/webhooks/{token}. The runtime fails closed and refuses to start
# without it, and the console's nginx injects it server-side so it never
# reaches the browser — so anything able to reach the console port holds full
# runtime authority.
#
# REQUIRED — there is deliberately no default. A shipped default here is a
# published credential: it grants the full runtime API to anyone who can reach
# the console Service, and `helm install` with no arguments would hand that out
# silently. The runtime itself fails closed without the token
# (api.py require_runtime_auth_token), and the chart now matches it.
#
#   --set runtimeAuthToken=$(openssl rand -hex 32)
#
# Must not contain a '$'. The console's entrypoint substitutes this into its
# nginx config, where a '$' reads as a variable reference and nginx refuses to
# start; the entrypoint rejects it up front with that explanation. Hex and
# base64 tokens are safe.
runtimeAuthToken: ""
# -- Monthly budget (USD) granted to the runtime's virtual key via
# AGENTOS_BOOTSTRAP_KEYS ("runtime:<runtimeKey>:<budget>").
runtimeBudget: 25

# -- Existing Secret holding provider API keys, mounted into the gateway as env.
# Expected keys (both optional): AGENTOS_ANTHROPIC_API_KEY, AGENTOS_OPENAI_API_KEY.
providerKeys:
  existingSecret: ""

# -- Used only when postgres.enabled=false. Full connection URL for the
# gateway store and the runtime checkpoint DB, e.g.
# postgres://user:pass@host:5432/agentos
externalDatabaseUrl: ""

# -- OTLP/HTTP endpoint (e.g. http://otel-collector:4318). When set it is
# exported as AGENTOS_OTEL_ENDPOINT on gateway and runtime.
otel:
  endpoint: ""

postgres:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  auth:
    username: agentos
    password: agentos
    database: agentos
  persistence:
    enabled: true
    size: 8Gi
    storageClassName: ""
  resources: {}

gateway:
  enabled: true
  image:
    repository: agentos/gateway
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  service:
    port: 8080
  guardrailsMode: "off"
  # -- Optional Ollama endpoint reachable from the cluster (empty = disabled).
  ollamaBaseUrl: ""
  # -- Comma-separated CORS origins (empty = none; console uses its nginx proxy).
  corsOrigins: ""
  resources: {}
  extraEnv: []

runtime:
  enabled: true
  image:
    repository: agentos/runtime
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8000
  model: "anthropic/claude-sonnet-5"
  embedModel: "ollama/bge-m3"
  agentProfile: "react"
  # -- Comma-joined into AGENTOS_APPROVAL_TOOLS (empty = HITL off).
  approvalTools: ""
  # -- Extra MCP server URLs appended to the composed AGENTOS_MCP_SERVERS.
  extraMcpServers: []
  resources: {}
  extraEnv: []

sqlConnector:
  enabled: true
  image:
    repository: agentos/sql-connector
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8090
  # -- Read-only ERP connection. Defaults to the bundled Postgres' seeded
  # legacy_erp DB; required when postgres.enabled=false.
  databaseUrl: ""
  maxRows: 200
  resources: {}
  extraEnv: []

restConnector:
  enabled: false
  image:
    repository: agentos/rest-connector
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8091
  # -- OpenAPI 3 JSON spec URL (required when enabled). Defaults to the
  # demo CRM's spec when demoCrm.enabled=true.
  specUrl: ""
  baseUrl: ""
  allowMutations: false
  # -- Raw header ("Name: value") attached to upstream calls (empty = none).
  authHeader: ""
  maxBodyBytes: 65536
  resources: {}

# Opt-in, like restConnector. Both join AGENTOS_MCP_SERVERS automatically when
# enabled, so the runtime picks them up without further wiring.
soapConnector:
  enabled: false
  image:
    repository: agentos/soap-connector
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8093
  # -- WSDL 1.1 document URL (required when enabled).
  wsdlUrl: ""
  # -- Override the endpoint address in the WSDL (empty = use the WSDL's).
  endpoint: ""
  # -- Comma-separated callable operations. EMPTY MEANS ALL OF THEM; name the
  # operations explicitly to bound what the agent can invoke.
  allowOperations: ""
  # -- Raw header ("Name: value") attached to upstream calls (empty = none).
  authHeader: ""
  timeoutSeconds: 20
  maxBodyBytes: 65536
  resources: {}
  extraEnv: []

browserConnector:
  enabled: false
  image:
    repository: agentos/browser-connector
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8094
  # -- Comma-separated navigable domains. EMPTY MEANS DENY ALL — the opposite
  # of soapConnector.allowOperations, and deliberately so: an un-listed domain
  # is an egress the agent should not have.
  allowDomains: ""
  timeoutSeconds: 20
  maxText: 20000
  resources: {}
  extraEnv: []
  extraEnv: []

sandbox:
  enabled: true
  image:
    repository: agentos/sandbox
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8070
  maxTimeoutSeconds: 30
  maxOutputBytes: 65536
  # -- Egress-less topology: a NetworkPolicy restricting the sandbox pod to
  # ingress from the runtime pod only and egress to kube-dns (port 53) only.
  # Requires a CNI that enforces NetworkPolicy (Calico, Cilium, ...);
  # disable only if you have an equivalent cluster-level control.
  networkPolicy:
    enabled: true
  # -- Defense-in-depth defaults; the pod also runs read-only with all
  # capabilities dropped (see templates/sandbox.yaml).
  resources:
    limits:
      cpu: "1"
      memory: 768Mi
    requests:
      cpu: 100m
      memory: 128Mi
  extraEnv: []

console:
  enabled: true
  image:
    repository: agentos/console
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources: {}
  extraEnv: []

# The public landing page. A static, self-contained document that calls no API
# and holds no credential, so it carries no proxy config, no secret and no
# dependency on the release — it serves whether or not the platform is up.
landing:
  enabled: true
  image:
    repository: agentos/landing
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources: {}
  # Its own Ingress, not the chart's: the landing page and the admin console
  # are normally published on different hosts, and routing both through the
  # single `ingress` block above would put the console behind the public
  # marketing domain. Leave disabled to expose it however you prefer.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    path: /
    pathType: Prefix
    tls: []

demoCrm:
  enabled: false
  image:
    repository: agentos/demo-crm
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8095
  resources: {}
  extraEnv: []

# -- Ingress for the console (which reverse-proxies gateway + runtime APIs).
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: agentos.local
  path: /
  pathType: Prefix
  tls: []
  # tls:
  #   - secretName: agentos-tls
  #     hosts: [agentos.example.com]
