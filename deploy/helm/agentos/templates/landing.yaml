{{- if .Values.landing.enabled }}
{{/*
The public landing page. Unlike the console it is a static, self-contained
document that calls no API and holds no credential, so it needs no templated
nginx config, no secret mount and no dependency on the rest of the release —
it serves whether or not the platform behind it is up.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentos.fullname" . }}-landing
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: landing
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: landing
  template:
    metadata:
      labels:
        {{- include "agentos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: landing
    spec:
      # No pod here calls the Kubernetes API, so mounting a ServiceAccount token
      # only widens what an escape reaches — most of all in the sandbox, which
      # exists to run model-authored code.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: landing
          image: "{{ .Values.landing.image.repository }}:{{ .Values.landing.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.landing.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              # 8080: the image runs nginx unprivileged, which cannot bind a
              # port below 1024. The Service port is unchanged.
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- with .Values.landing.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.fullname" . }}-landing
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: landing
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.landing.service.port }}
      targetPort: http
  selector:
    {{- include "agentos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: landing
{{- if .Values.landing.ingress.enabled }}
{{- if not .Values.landing.ingress.host }}
{{- fail "landing.ingress.enabled requires landing.ingress.host" }}
{{- end }}
---
{{/*
Deliberately a separate Ingress from the chart's main one: the landing page and
the admin console are normally published on different hosts, and routing both
through one rule would put the console behind the marketing domain.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentos.fullname" . }}-landing
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: landing
  {{- with .Values.landing.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.landing.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.landing.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.landing.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.landing.ingress.path }}
            pathType: {{ .Values.landing.ingress.pathType }}
            backend:
              service:
                name: {{ include "agentos.fullname" . }}-landing
                port:
                  number: {{ .Values.landing.service.port }}
{{- end }}
{{- end }}
