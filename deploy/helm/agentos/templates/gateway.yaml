{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentos.fullname" . }}-gateway
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "agentos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      # No pod here calls the Kubernetes API, so mounting a ServiceAccount token
      # only widens what an escape reaches — most of all in the sandbox, which
      # exists to run model-authored code.
      automountServiceAccountToken: false
      # The gateway drains for up to 30s on SIGTERM (cmd/gateway/main.go), and
      # in-flight requests hold budget reservations released only when they
      # finish. Kubernetes' default grace period is also 30s, so SIGKILL would
      # land exactly as the drain expires and strand those holds until the
      # reaper clears them. compose buys the same 10s of headroom via
      # stop_grace_period: 40s.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENTOS_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.secretName" . }}
                  key: admin-key
            - name: AGENTOS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.secretName" . }}
                  key: database-url
            - name: AGENTOS_BOOTSTRAP_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.secretName" . }}
                  key: bootstrap-keys
            - name: AGENTOS_GUARDRAILS_MODE
              value: {{ .Values.gateway.guardrailsMode | quote }}
            {{- with .Values.gateway.ollamaBaseUrl }}
            - name: AGENTOS_OLLAMA_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.corsOrigins }}
            - name: AGENTOS_CORS_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.otel.endpoint }}
            - name: AGENTOS_OTEL_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- include "agentos.providerKeyEnv" . | nindent 12 }}
            {{- with .Values.gateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- with .Values.gateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.fullname" . }}-gateway
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
  selector:
    {{- include "agentos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
{{- end }}
