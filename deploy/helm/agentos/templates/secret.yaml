apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentos.secretName" . }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-key: {{ .Values.adminKey | quote }}
  runtime-key: {{ .Values.runtimeKey | quote }}
  bootstrap-keys: {{ printf "runtime:%s:%v" .Values.runtimeKey .Values.runtimeBudget | quote }}
  database-url: {{ include "agentos.databaseUrl" . | quote }}
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ .Values.postgres.auth.password | quote }}
  {{- end }}
  {{- if .Values.sqlConnector.enabled }}
  connector-database-url: {{ include "agentos.connectorDatabaseUrl" . | quote }}
  {{- end }}
