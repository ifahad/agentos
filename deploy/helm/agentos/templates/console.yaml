{{- if .Values.console.enabled }}
{{/*
The console image ships an nginx config template naming the compose hostnames
("gateway", "runtime"). In Kubernetes the services are named after the chart
fullname, so this ConfigMap replaces that template.

It is mounted over /etc/nginx/templates/default.conf.template — the image's
INPUT — not over /etc/nginx/conf.d/default.conf, its output. The entrypoint
runs `envsubst < templates/default.conf.template > conf.d/default.conf` under
`set -eu`, so mounting the output path read-only makes that write fail and the
container exit before nginx ever starts.

Consequently ${AGENTOS_RUNTIME_AUTH_TOKEN} below is deliberately NOT rendered
by Helm: envsubst substitutes it at container start, which is what keeps the
runtime bearer out of both the manifest and the browser.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentos.fullname" . }}-console-nginx
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
data:
  default.conf.template: |
{{ include "agentos.consoleNginxConf" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentos.fullname" . }}-console
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "agentos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console
      annotations:
        # Hash the config's ACTUAL bytes, not a couple of the values that feed
        # it: the ConfigMap is subPath-mounted, so it is frozen for the pod's
        # lifetime and an edit that triggers no rollout never takes effect.
        checksum/nginx-config: {{ include "agentos.consoleNginxConf" . | sha256sum }}
        # And the token, because envsubst bakes it into the rendered config at
        # container start. Without this, rotating runtimeAuthToken rewrites the
        # Secret and rolls nothing — the console keeps injecting the old bearer
        # while staying Ready, since its probe is the static SPA shell and never
        # touches the proxy. The runtime carries the matching annotation.
        checksum/runtime-token: {{ .Values.runtimeAuthToken | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              # 8080: the console image runs nginx unprivileged, which cannot
              # bind a port below 1024. The Service port is unchanged.
              containerPort: 8080
          env:
            # envsubst reads this at container start to fill the Authorization
            # header in the config template above. Without it the header renders
            # as an empty Bearer and every /api/runtime/ call 401s.
            - name: AGENTOS_RUNTIME_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.secretName" . }}
                  key: runtime-auth-token
            {{- with .Values.console.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- with .Values.console.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "agentos.fullname" . }}-console-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.fullname" . }}-console
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
  selector:
    {{- include "agentos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: console
{{- end }}
