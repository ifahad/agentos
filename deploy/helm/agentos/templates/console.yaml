{{- if .Values.console.enabled }}
{{/*
The console image bakes an nginx config that proxies /api/gateway and
/api/runtime to the compose hostnames ("gateway", "runtime"). In Kubernetes
the services are named after the chart fullname, so we override
/etc/nginx/conf.d/default.conf with a templated copy of the same config.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentos.fullname" . }}-console-nginx
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/gateway/ {
            proxy_pass {{ include "agentos.gatewayUrl" . }}/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location /api/runtime/ {
            proxy_pass http://{{ include "agentos.fullname" . }}-runtime:{{ .Values.runtime.service.port }}/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentos.fullname" . }}-console
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "agentos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console
      annotations:
        checksum/nginx-config: {{ printf "%s-%s" (include "agentos.gatewayUrl" .) (include "agentos.fullname" .) | sha256sum }}
    spec:
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          {{- with .Values.console.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- with .Values.console.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "agentos.fullname" . }}-console-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.fullname" . }}-console
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
  selector:
    {{- include "agentos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: console
{{- end }}
