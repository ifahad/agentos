receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal
  # To forward traces to Langfuse (or any OTLP backend), uncomment and fill in:
  # otlphttp/langfuse:
  #   endpoint: https://cloud.langfuse.com/api/public/otel
  #   headers:
  #     Authorization: "Basic <base64(public_key:secret_key)>"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]   # add otlphttp/langfuse here to forward
