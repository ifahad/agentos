# Langfuse-aware collector config, mounted by compose.langfuse.yaml in place of
# otel-collector.yaml. Traces go to BOTH the debug exporter and Langfuse.
# ${env:VAR:-default} is collector-contrib confmap syntax (>= 0.102.0), NOT
# docker-compose interpolation — the vars are injected into the container by
# compose.langfuse.yaml. Until LANGFUSE_OTLP_BASIC_AUTH is set (first-run key
# setup), Langfuse rejects the export with 401 while the debug exporter keeps
# working; the collector logs the failures but stays up.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT:-http://langfuse:3000/api/public/otel}
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTLP_BASIC_AUTH:-}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/langfuse]
