name: agentos

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos
      POSTGRES_DB: agentos
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${AGENTOS_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    build: ../gateway
    environment:
      AGENTOS_ADMIN_KEY: ${AGENTOS_ADMIN_KEY:-admin-local-dev}
      AGENTOS_DATABASE_URL: postgres://agentos:agentos@postgres:5432/agentos
      AGENTOS_ANTHROPIC_API_KEY: ${AGENTOS_ANTHROPIC_API_KEY:-}
      AGENTOS_OPENAI_API_KEY: ${AGENTOS_OPENAI_API_KEY:-}
      AGENTOS_OLLAMA_BASE_URL: ${AGENTOS_OLLAMA_BASE_URL:-}
      AGENTOS_BOOTSTRAP_KEYS: "runtime:${AGENTOS_RUNTIME_KEY:-agos-local-dev-runtime}:25"
      AGENTOS_GUARDRAILS_MODE: ${AGENTOS_GUARDRAILS_MODE:-off}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AGENTOS_GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  sql-connector:
    build: ../connectors/sql
    environment:
      AGENTOS_CONNECTOR_DATABASE_URL: postgres://erp_reader:erp_reader@postgres:5432/legacy_erp
      AGENTOS_CONNECTOR_MAX_ROWS: "200"
    ports:
      - "${AGENTOS_CONNECTOR_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy

  runtime:
    build: ../runtime
    environment:
      AGENTOS_GATEWAY_URL: http://gateway:8080
      AGENTOS_GATEWAY_KEY: ${AGENTOS_RUNTIME_KEY:-agos-local-dev-runtime}
      AGENTOS_MODEL: ${AGENTOS_MODEL:-anthropic/claude-sonnet-5}
      AGENTOS_MCP_SERVERS: http://sql-connector:8090/mcp
      AGENTOS_CHECKPOINT_DATABASE_URL: postgres://agentos:agentos@postgres:5432/agentos
      AGENTOS_APPROVAL_TOOLS: ${AGENTOS_APPROVAL_TOOLS:-}
      AGENTOS_EMBED_MODEL: ${AGENTOS_EMBED_MODEL:-ollama/bge-m3}
      AGENTOS_AGENT_PROFILE: ${AGENTOS_AGENT_PROFILE:-react}
    ports:
      - "${AGENTOS_RUNTIME_PORT:-8000}:8000"
    depends_on:
      - gateway
      - sql-connector

  console:
    build: ../console
    ports:
      - "${AGENTOS_CONSOLE_PORT:-3000}:80"
    depends_on:
      - gateway
      - runtime

volumes:
  pgdata:
