name: agentos

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos
      POSTGRES_DB: agentos
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${AGENTOS_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    build: ../gateway
    # The gateway drains in-flight requests for up to 30s on SIGTERM. Docker's
    # default grace period is 10s, which would SIGKILL it mid-drain and strand
    # the budget reservations those requests are holding.
    stop_grace_period: 40s
    environment:
      AGENTOS_ADMIN_KEY: ${AGENTOS_ADMIN_KEY:-admin-local-dev}
      AGENTOS_DATABASE_URL: postgres://agentos:agentos@postgres:5432/agentos
      AGENTOS_ANTHROPIC_API_KEY: ${AGENTOS_ANTHROPIC_API_KEY:-}
      AGENTOS_OPENAI_API_KEY: ${AGENTOS_OPENAI_API_KEY:-}
      AGENTOS_OLLAMA_BASE_URL: ${AGENTOS_OLLAMA_BASE_URL:-}
      AGENTOS_BOOTSTRAP_KEYS: "runtime:${AGENTOS_RUNTIME_KEY:-agos-local-dev-runtime}:25"
      AGENTOS_GUARDRAILS_MODE: ${AGENTOS_GUARDRAILS_MODE:-off}
      AGENTOS_GUARDRAILS_MODEL: ${AGENTOS_GUARDRAILS_MODEL:-anthropic/claude-haiku-4-5}
      AGENTOS_GUARDRAILS_KEY: ${AGENTOS_GUARDRAILS_KEY:-}
      AGENTOS_GUARDRAILS_TIMEOUT_S: ${AGENTOS_GUARDRAILS_TIMEOUT_S:-}
      AGENTOS_BOOTSTRAP_ORG: ${AGENTOS_BOOTSTRAP_ORG:-default}
      AGENTOS_SECRETS_BACKEND: ${AGENTOS_SECRETS_BACKEND:-env}
      AGENTOS_SECRETS_FILE: ${AGENTOS_SECRETS_FILE:-}
      AGENTOS_SECRETS_AGE_KEY: ${AGENTOS_SECRETS_AGE_KEY:-}
      AGENTOS_VAULT_ADDR: ${AGENTOS_VAULT_ADDR:-}
      AGENTOS_VAULT_TOKEN: ${AGENTOS_VAULT_TOKEN:-}
      AGENTOS_VAULT_KV_PATH: ${AGENTOS_VAULT_KV_PATH:-}
      AGENTOS_RATE_LIMIT_RPM: ${AGENTOS_RATE_LIMIT_RPM:-0}
      AGENTOS_AUDIT_RETENTION_DAYS: ${AGENTOS_AUDIT_RETENTION_DAYS:-}
      AGENTOS_MAX_BODY_BYTES: ${AGENTOS_MAX_BODY_BYTES:-}
      AGENTOS_BUDGET_RESERVE_USD: ${AGENTOS_BUDGET_RESERVE_USD:-}
      AGENTOS_RATELIMIT_BACKEND: ${AGENTOS_RATELIMIT_BACKEND:-memory}
      AGENTOS_SCIM_TOKEN: ${AGENTOS_SCIM_TOKEN:-}
      AGENTOS_SCIM_DEFAULT_ORG: ${AGENTOS_SCIM_DEFAULT_ORG:-org_default}
      AGENTOS_SCIM_DEFAULT_ROLE: ${AGENTOS_SCIM_DEFAULT_ROLE:-member}
      AGENTOS_SECRETS_REFRESH_S: ${AGENTOS_SECRETS_REFRESH_S:-0}
      AGENTOS_OIDC_ISSUER: ${AGENTOS_OIDC_ISSUER:-}
      AGENTOS_OIDC_CLIENT_ID: ${AGENTOS_OIDC_CLIENT_ID:-}
      AGENTOS_OIDC_CLIENT_SECRET: ${AGENTOS_OIDC_CLIENT_SECRET:-}
      AGENTOS_OIDC_REDIRECT_URL: ${AGENTOS_OIDC_REDIRECT_URL:-}
      AGENTOS_OIDC_POST_LOGIN_URL: ${AGENTOS_OIDC_POST_LOGIN_URL:-}
      AGENTOS_OIDC_DEFAULT_ORG: ${AGENTOS_OIDC_DEFAULT_ORG:-org_default}
      AGENTOS_OIDC_DEFAULT_ROLE: ${AGENTOS_OIDC_DEFAULT_ROLE:-member}
      # Config-driven providers. Compose injects ONLY the variables declared
      # here, so each frontier key must be listed or it never reaches the
      # container even when set in .env (a trap that has bitten this repo before).
      AGENTOS_PROVIDERS_FILE: /app/providers.json
      AGENTOS_MOONSHOT_API_KEY: ${AGENTOS_MOONSHOT_API_KEY:-}
      AGENTOS_ZHIPU_API_KEY: ${AGENTOS_ZHIPU_API_KEY:-}
      AGENTOS_ALIBABA_API_KEY: ${AGENTOS_ALIBABA_API_KEY:-}
      AGENTOS_DEEPSEEK_API_KEY: ${AGENTOS_DEEPSEEK_API_KEY:-}
      AGENTOS_MINIMAX_API_KEY: ${AGENTOS_MINIMAX_API_KEY:-}
      # The council/* model: the gateway proxies it to the runtime's council API.
      AGENTOS_COUNCIL_RUNTIME_URL: ${AGENTOS_COUNCIL_RUNTIME_URL:-http://runtime:8000}
      AGENTOS_RUNTIME_AUTH_TOKEN: ${AGENTOS_RUNTIME_AUTH_TOKEN:-runtime-local-dev}
    volumes:
      - ./providers.json:/app/providers.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AGENTOS_GATEWAY_PORT:-8080}:8080"
    # The image is distroless (no shell, no curl), so the binary probes itself.
    healthcheck:
      test: ["CMD", "/gateway", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  sql-connector:
    build: ../connectors/sql
    environment:
      AGENTOS_CONNECTOR_DATABASE_URL: postgres://erp_reader:erp_reader@postgres:5432/legacy_erp
      AGENTOS_CONNECTOR_MAX_ROWS: "200"
      AGENTOS_CONNECTOR_STATEMENT_TIMEOUT_S: ${AGENTOS_CONNECTOR_STATEMENT_TIMEOUT_S:-30}
    ports:
      - "${AGENTOS_CONNECTOR_PORT:-8090}:8090"
    # Liveness only — see runHealthCheck in cmd/sql-connector: probing the MCP
    # endpoint itself would open an event stream and hang.
    healthcheck:
      test: ["CMD", "/sql-connector", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  runtime:
    build: ../runtime
    environment:
      AGENTOS_GATEWAY_URL: http://gateway:8080
      AGENTOS_GATEWAY_KEY: ${AGENTOS_RUNTIME_KEY:-agos-local-dev-runtime}
      AGENTOS_MODEL: ${AGENTOS_MODEL:-anthropic/claude-sonnet-5}
      AGENTOS_MCP_SERVERS: http://sql-connector:8090/mcp,http://rest-connector:8091/mcp
      AGENTOS_SANDBOX_URL: http://sandbox:8070
      AGENTOS_CHECKPOINT_DATABASE_URL: postgres://agentos:agentos@postgres:5432/agentos
      AGENTOS_APPROVAL_TOOLS: ${AGENTOS_APPROVAL_TOOLS:-}
      AGENTOS_EMBED_MODEL: ${AGENTOS_EMBED_MODEL:-ollama/bge-m3}
      AGENTOS_AGENT_PROFILE: ${AGENTOS_AGENT_PROFILE:-react}
      AGENTOS_JUDGE_MODEL: ${AGENTOS_JUDGE_MODEL:-anthropic/claude-haiku-4-5}
      AGENTOS_RUNTIME_AUTH_TOKEN: ${AGENTOS_RUNTIME_AUTH_TOKEN:-runtime-local-dev}
      AGENTOS_MAX_CONTEXT_TOKENS: ${AGENTOS_MAX_CONTEXT_TOKENS:-0}
      # Multiverse council. Config path is baked into the image at /app/council.yaml;
      # the heartbeat stays OFF (0) unless explicitly enabled — the council serves
      # its API but never acts autonomously by default.
      AGENTOS_COUNCIL_CONFIG: ${AGENTOS_COUNCIL_CONFIG:-/app/council.yaml}
      AGENTOS_COUNCIL_HEARTBEAT_S: ${AGENTOS_COUNCIL_HEARTBEAT_S:-0}
      AGENTOS_COUNCIL_MAX_SPEND_USD: ${AGENTOS_COUNCIL_MAX_SPEND_USD:-5}
      # Operators: single-agent autonomy. Scheduler OFF by default — the runtime
      # serves the operators API but never fires on its own unless enabled.
      AGENTOS_AUTONOMY_ENABLED: ${AGENTOS_AUTONOMY_ENABLED:-false}
      AGENTOS_AUTONOMY_TICK_S: ${AGENTOS_AUTONOMY_TICK_S:-15}
      AGENTOS_AUTONOMY_MAX_CYCLES: ${AGENTOS_AUTONOMY_MAX_CYCLES:-8}
    ports:
      - "${AGENTOS_RUNTIME_PORT:-8000}:8000"
    # On both networks: `default` to reach gateway/postgres/connectors, and
    # the internal `sandbox-net` to reach the sandbox (the only route in).
    networks:
      - default
      - sandbox-net
    # python is in the image (it is the runtime); no curl is.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen(
              "http://127.0.0.1:8000/healthz", timeout=2).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 10
      # The runtime imports langchain/langgraph before it serves, which is slow
      # on a cold start; failures inside this window do not count against
      # retries or mark the container unhealthy.
      start_period: 90s
    depends_on:
      gateway:
        condition: service_healthy
      sql-connector:
        condition: service_healthy
      rest-connector:
        condition: service_healthy
      sandbox:
        condition: service_healthy

  sandbox:
    build: ../sandbox
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 256
    cpus: "1.0"
    # Egress-less topology (Phase 4): the sandbox lives ONLY on the internal
    # sandbox-net, so code running inside it has no route to the internet or
    # to the other agentos services; only the runtime (also on sandbox-net)
    # can reach it at http://sandbox:8070. No `ports:` mapping — Docker
    # forbids publishing host ports from an `internal: true` network; reach
    # it for debugging via `docker compose exec runtime curl http://sandbox:8070/...`.
    networks:
      - sandbox-net
    # python3 is in the image because the sandbox executes Python; the probe
    # runs inside the container, so the internal-only network is no obstacle.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen(
              "http://127.0.0.1:8070/healthz", timeout=2).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  demo-crm:
    build: ../deploy/demo-crm
    ports:
      - "${AGENTOS_CRM_PORT:-8095}:8095"
    healthcheck:
      test: ["CMD", "/demo-crm", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  rest-connector:
    build: ../connectors/rest
    environment:
      AGENTOS_REST_SPEC_URL: http://demo-crm:8095/openapi.json
    ports:
      - "${AGENTOS_REST_PORT:-8091}:8091"
    # Liveness only, for the same reason as sql-connector.
    healthcheck:
      test: ["CMD", "/rest-connector", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      demo-crm:
        condition: service_healthy

  # Opt-in connectors (Phase 5). Start with:
  #   docker compose --profile connectors up -d
  # or individually: docker compose up -d soap-connector
  soap-connector:
    build: ../connectors/soap
    profiles: ["connectors", "soap"]
    environment:
      # Point at your legacy WSDL; the demo default is a public sample.
      AGENTOS_SOAP_WSDL_URL: ${AGENTOS_SOAP_WSDL_URL:-http://demo-crm:8095/soap?wsdl}
      AGENTOS_SOAP_ALLOW_OPERATIONS: ${AGENTOS_SOAP_ALLOW_OPERATIONS:-}
    ports:
      - "${AGENTOS_SOAP_PORT:-8093}:8093"

  browser-connector:
    build: ../connectors/browser
    profiles: ["connectors", "browser"]
    environment:
      AGENTOS_BROWSER_ALLOW_DOMAINS: ${AGENTOS_BROWSER_ALLOW_DOMAINS:-}
      AGENTOS_BROWSER_TIMEOUT_S: ${AGENTOS_BROWSER_TIMEOUT_S:-20}
    ports:
      - "${AGENTOS_BROWSER_PORT:-8094}:8094"

  console:
    build: ../console
    environment:
      # nginx injects this as the Bearer token when proxying /api/runtime/,
      # so the browser never holds the runtime credential.
      AGENTOS_RUNTIME_AUTH_TOKEN: ${AGENTOS_RUNTIME_AUTH_TOKEN:-runtime-local-dev}
    ports:
      - "${AGENTOS_CONSOLE_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      gateway:
        condition: service_healthy
      runtime:
        condition: service_healthy

  # The public landing page. It is a static, self-contained document that calls
  # no API and holds no credential, so unlike the console it has no depends_on
  # and no proxy config — it comes up and stays up independently of whether the
  # rest of the stack is healthy.
  landing:
    build: ../landing
    ports:
      - "${AGENTOS_LANDING_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  # Internal-only network for the code-execution sandbox: containers on it
  # can talk to each other, but there is no gateway to the host or internet
  # (egress-less). Only sandbox + runtime are attached.
  sandbox-net:
    internal: true

volumes:
  pgdata:
